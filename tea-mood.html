<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  .tea{--bg:#BBA9A6;--ivory:#3D2A28;--dim:#5C4542;--gold:#96762C;--line:rgba(61,42,40,.13);
    background:radial-gradient(140% 100% at 50% 0%,#C9BDB8 0%,var(--bg) 55%,#A88C87 100%);
    color:var(--ivory);margin:0;padding:0 0 40px;border-radius:6px;
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Hoefler Text",Georgia,serif;
    line-height:1.85;-webkit-font-smoothing:antialiased}
  .tea *{box-sizing:border-box}
  .wrap{padding:0 30px}
  .center{text-align:center}

  header{padding:40px 30px 26px;text-align:center}
  header p{margin:0}
  .mark{font-size:15px;letter-spacing:.26em;color:var(--gold);text-indent:.26em}
  .rule{width:6px;height:6px;margin:16px auto 0;background:var(--gold);opacity:.7;transform:rotate(45deg)}
  .lede{font-size:12px;color:var(--dim);letter-spacing:.1em;margin-top:12px}

  .cover{display:block;width:calc(100% - 60px);margin:6px auto 34px;opacity:.96;border-radius:2px;
    box-shadow:0 20px 40px -18px rgba(51,41,31,.35)}
  figure{margin:0 auto;position:relative;max-width:216px;width:60%;border-radius:2px;
    box-shadow:0 22px 36px -16px rgba(51,41,31,.32)}
  figure img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:2px;
    border:1px solid var(--line)}
  .prog{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold);
    transition:width 1s linear}
  .fade{animation:f .6s ease both}@keyframes f{from{opacity:0}to{opacity:1}}
  @media(prefers-reduced-motion:reduce){.fade{animation:none}}

  .house{font-size:9.5px;letter-spacing:.34em;color:var(--gold);margin:20px 0 0;text-indent:.34em}
  .name{font-family:Georgia,"Hoefler Text",serif;font-size:23px;font-weight:400;
    letter-spacing:.05em;margin:9px 0 0;line-height:1.35}
  .name:after{content:"";display:block;width:28px;height:1px;background:var(--gold);
    opacity:.55;margin:14px auto 0}
  .kind{font-size:10.5px;letter-spacing:.22em;color:var(--dim);margin:8px 0 0;text-indent:.22em}

  .meta{display:none;justify-content:center;align-items:center;gap:0;margin:22px 0 0;
    font-size:11px;letter-spacing:.16em;color:var(--dim)}
  .meta.shown{display:flex}
  .meta span{padding:0 16px;position:relative}
  .meta span+span:before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;
    background:var(--line)}
  .meta b{color:var(--ivory);font-weight:400;font-family:Georgia,serif;font-size:13.5px;letter-spacing:.04em}
  .go{display:block;margin:22px auto 0;background:none;border:0;border-bottom:1px solid var(--gold);
    color:var(--gold);font:inherit;font-size:13px;letter-spacing:.3em;text-indent:.3em;
    padding:0 4px 6px;cursor:pointer;transition:color .25s,border-color .25s}
  .go:focus-visible{outline:1px solid var(--gold);outline-offset:5px}

  .orn{height:1px;width:130px;margin:34px auto 26px;
    background:linear-gradient(to right,transparent,var(--gold),transparent);opacity:.5}
  .pickLabel{font-size:9.5px;letter-spacing:.34em;color:var(--gold);margin:0 0 14px;
    text-indent:.34em;opacity:.85}
  .tabs{display:inline-flex;justify-content:center;gap:2px;margin:0 0 20px;
    background:rgba(255,250,246,.6);border-radius:999px;padding:4px}
  .tab{background:none;border:0;border-radius:999px;color:var(--dim);font:inherit;font-size:12px;
    letter-spacing:.14em;padding:7px 15px;cursor:pointer;position:relative;transition:color .25s,background .25s}
  .tab[aria-selected="true"]{color:#FBF7EE;background:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .chip{background:none;border:1px solid var(--line);border-radius:999px;color:var(--dim);
    font:inherit;font-size:12.5px;letter-spacing:.06em;padding:7px 16px;cursor:pointer;
    transition:color .25s,background .25s,border-color .25s}
  .chip[aria-pressed="true"]{color:#FBF7EE;background:var(--gold);border-color:var(--gold)}
  .chip:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
  .hint{font-size:11px;color:var(--dim);letter-spacing:.08em;margin:18px 0 0}

  .sec{font-size:9.5px;letter-spacing:.34em;color:var(--gold);margin:30px 0 16px;text-indent:.34em}
  .strip{display:flex;align-items:flex-start;gap:17px;overflow-x:auto;padding:4px 30px 10px;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .thumb{flex:0 0 66px;border:0;background:none;padding:0;cursor:pointer}
  .thumb img{width:66px;height:66px;object-fit:cover;display:block;border:1px solid transparent;
    border-radius:2px;filter:saturate(.92) opacity(.55);
    transition:filter .4s,border-color .4s,transform .3s,box-shadow .3s}
  .thumb.on img{filter:none;border-color:var(--gold);box-shadow:0 6px 14px -4px rgba(150,118,44,.4)}
  .thumb span{display:block;font-size:7.5px;letter-spacing:.13em;color:var(--dim);margin-top:9px;line-height:1.5}
  .thumb:focus-visible img{outline:1px solid var(--gold);outline-offset:3px}
  @media(hover:hover){
    .thumb:hover img{transform:translateY(-3px)}
    .go:hover{color:#7c5f20}
    .tab:hover{color:var(--ivory)}
    .chip:hover{color:var(--ivory)}
    .shelfToggle:hover{opacity:.8}
  }

  .shelfToggle{background:none;border:0;font:inherit;letter-spacing:.34em;text-indent:.34em;
    font-size:9.5px;color:var(--gold);cursor:pointer;display:block;width:100%;padding:0;margin:30px 0 16px}
  .shelfToggle:after{content:"（タップして開く）";letter-spacing:.05em;text-indent:0;margin-left:.6em;color:var(--dim)}
  .shelfToggle[aria-expanded="true"]:after{content:"（タップして閉じる）"}
  .shelfToggle:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
  #all{display:none}
  #all.open{display:flex}

  .detail{max-width:30em;margin:18px auto 0;text-align:left;font-size:13.5px;
    color:rgba(46,39,33,.9);letter-spacing:.02em;line-height:1.9}
  .detail:before{content:"";display:block;width:22px;height:1px;background:var(--gold);
    opacity:.6;margin:0 0 18px}
  .detail p{margin:0 0 14px}
  .detail p:last-of-type{margin-bottom:0}
  .detail a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold);
    font-size:12px;display:inline-block;margin-top:6px}
  .detail .src{font-size:10px;color:var(--dim);letter-spacing:.05em;margin-top:6px}
</style>

<div class="tea">
  <header>
    <p class="mark">AKI'S TEA SALON</p>
    <p class="rule"></p>
    <p class="lede" id="lede">…</p>
  </header>

  <img class="cover" id="cover" alt="Aki's Tea Salon">

  <div class="wrap center">
    <p class="pickLabel">選び方</p>
    <div class="tabs" id="tabs"></div>
    <div class="chips" id="chips"></div>
    <p class="hint" id="hint"></p>
  </div>

  <p class="sec center" id="nearLabel">この条件に合う缶</p>
  <div class="strip" id="near"></div>
  <button class="shelfToggle" id="shelfToggle" aria-expanded="false">棚をながめる</button>
  <div class="strip" id="all"></div>

  <div class="orn"></div>

  <figure><img id="photo" alt=""><div class="prog" id="prog"></div></figure>

  <div class="wrap center">
    <p class="house" id="house"></p>
    <h2 class="name" id="name"></h2>
    <p class="kind" id="kind"></p>
    <div class="detail" id="detail"></div>
    <div class="meta" id="meta"></div>
    <button class="go" id="go">淹れる</button>
  </div>
</div>

 a:["素朴","柑橘"],o:["寝る前","家族と"],d:["ストレート"],
 url:"https://okinawa-herb.jp/category/tea/",

  "月桃、バタフライピー、ハイビスカス、シークヮーサー、ノニ葉、マロウブルーなど、6つの組み合わせから気分や体調で選べます。",
  "カフェインゼロなので、時間を問わずストレートでどうぞ。"]},

const MODES=[
 {id:"now",l:"いま",opts:null},
 {id:"a",l:"香り",opts:["スパイス","柑橘","花","果実","甘い菓子","素朴"]},
 {id:"o",l:"場面",opts:["朝いちばん","仕事中","家族と","来客に","食後に","寝る前"]},
 {id:"d",l:"飲み方",opts:["ストレート","ミルク","アイス"]},
];
let mode="now",chip=null,cur=null,near=[],timer=null,left=0;

function slot(){const h=new Date().getHours();
  return h<5?"寝る前":h<10?"朝いちばん":h<15?"仕事中":h<19?"家族と":h<22?"食後に":"寝る前";}
function lede(){return {"朝いちばん":"朝です。目を覚ます一杯を。","仕事中":"日中です。仕事のお供に一杯を。",
  "家族と":"夕方です。ひと息つく一杯を。","食後に":"夜です。食後の一杯を。",
  "寝る前":"夜更けです。静かに終わる一杯を。"}[slot()];}
function candidates(){
  if(mode==="now"){const s=slot();let p=T.filter(t=>t.o.includes(s));
    if(s==="寝る前"){const q=p.filter(t=>t.caf===0);if(q.length)p=q;}
    return p.length?p:T.slice();}
  if(!chip)return T.slice();
  return T.filter(t=>t[mode].includes(chip));
}
function choose(){near=candidates();show(near[Math.floor(Math.random()*near.length)]);}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function show(t){
  cur=t;stop();
  const img=document.getElementById("photo");
  img.src=IMG[t.id];img.alt=t.n+"の缶";img.classList.remove("fade");void img.offsetWidth;img.classList.add("fade");
  document.getElementById("house").textContent=t.h;
  document.getElementById("name").textContent=t.n;
  document.getElementById("kind").textContent=t.k+(t.caf===0?"・ノンカフェイン":"");
  document.getElementById("detail").innerHTML=detailHTML(t);
  meta();
  document.getElementById("meta").classList.remove("shown");
  document.getElementById("prog").style.width="0";
  const g=document.getElementById("go");
  g.textContent=t.sec===0?"冷蔵庫で一晩":"淹れる";
  g.style.borderBottomColor=t.sec===0?"transparent":"";
  g.style.cursor=t.sec===0?"default":"pointer";
  strip("near",near,t);strip("all",T,t);
  document.getElementById("nearLabel").textContent=
    mode==="now"?"いまの時間に合う缶":(chip?chip+"の缶":"この条件に合う缶");
}
function detailHTML(t){
  if(!t.desc)return `<p>${t.w.replace(/<\/?b>/g,"")}</p>`;
  let html=t.desc.map(p=>`<p>${p}</p>`).join("");
  if(t.url)html+=`<a href="${t.url}" target="_blank" rel="noopener">${t.h}公式サイトで見る</a><p class="src">情報源：${t.h}公式サイト</p>`;
  return html;
}
function meta(s){
  document.getElementById("meta").innerHTML=
    (cur.sec===0
      ? `<span><b>冷水</b></span><span><b>8時間</b></span><span><b>${cur.g}</b> / 1L</span>`
      : `<span><b>${cur.temp}</b>°C</span><span><b>${s||fmt(cur.sec)}</b></span><span><b>${cur.g}</b> / 200ml</span>`);
}
function strip(el,list,c){
  const e=document.getElementById(el);e.innerHTML="";
  list.forEach(t=>{const b=document.createElement("button");
    b.className="thumb"+(t===c?" on":"");b.setAttribute("aria-label",t.n);
    b.innerHTML=`<img src="${IMG[t.id]}" alt=""><span>${t.n.split(" — ")[0].split(" No.")[0]}</span>`;
    b.onclick=()=>show(t);e.appendChild(b);});
}
const tabs=document.getElementById("tabs");
MODES.forEach(m=>{const b=document.createElement("button");
  b.className="tab";b.textContent=m.l;b.dataset.id=m.id;
  b.setAttribute("aria-selected",m.id===mode);
  b.onclick=()=>{mode=m.id;chip=null;paint();choose();};tabs.appendChild(b);});
function paint(){
  [...tabs.children].forEach(b=>b.setAttribute("aria-selected",b.dataset.id===mode));
  const m=MODES.find(x=>x.id===mode),c=document.getElementById("chips");
  c.innerHTML="";
  if(!m.opts){document.getElementById("hint").textContent="いまの時刻から選んでいます。";return;}
  m.opts.forEach(o=>{const b=document.createElement("button");
    b.className="chip";b.textContent=o;b.setAttribute("aria-pressed",o===chip);
    b.onclick=()=>{chip=o;paint();choose();};c.appendChild(b);});
  document.getElementById("hint").textContent=chip?"":"ひとつ選んでください。";
}
document.getElementById("go").onclick=()=>{
  document.getElementById("meta").classList.add("shown");
  if(cur.sec===0)return;
  if(timer){stop();meta();document.getElementById("prog").style.width="0";return;}
  left=cur.sec;tick();
  timer=setInterval(()=>{left--;if(left<=0){stop();done();}else tick();},1000);
  document.getElementById("go").textContent="とめる";
};
function tick(){meta(fmt(left));
  document.getElementById("prog").style.width=(100*(1-left/cur.sec))+"%";}
function stop(){if(timer){clearInterval(timer);timer=null;}
  const g=document.getElementById("go");if(g)g.textContent="淹れる";}
function done(){meta("できました");document.getElementById("prog").style.width="100%";
  if(navigator.vibrate)navigator.vibrate([180,90,180]);}

document.getElementById("shelfToggle").onclick=()=>{
  const open=document.getElementById("all").classList.toggle("open");
  document.getElementById("shelfToggle").setAttribute("aria-expanded",open);
};
document.getElementById("cover").src=IMG._shelf;
document.getElementById("lede").textContent=lede();
paint();choose();
</script>
